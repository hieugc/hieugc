  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pham Minh Hieu - .NET Software Engineer with 2+ years of experience building scalable web systems for government and enterprises. Specialized in .NET Core MVC, API development, and database design.">
  <meta name="keywords" content="Pham Minh Hieu, .NET Developer, Software Engineer, Full Stack Developer, ASP.NET MVC, API Development">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pham Minh Hieu Portfolio">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hieugc.github.io/">

  <meta property="twitter:description" content="Professional portfolio showcasing 2+ years of experience in .NET development, API design, and full-stack web applications.">

  <title>Pham Minh Hieu - .NET Software Engineer Portfolio</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="apple-touch-icon" href="favicon.jpg">
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "1904378469";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
